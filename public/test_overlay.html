    body { margin: 0; background: #07120a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #fff; }
    .wrapper { position: relative; width: 1024px; height: 576px; box-shadow: 0 15px 50px rgba(0,0,0,0.85); border-radius: 12px; overflow: hidden; border: 1px solid #1a3826; }
    img { width: 1024px; height: 576px; display: block; }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .plot-hotspot {
      fill: transparent;
      stroke: transparent;
      stroke-width: 2;
      rx: 6;
      cursor: pointer;
      transition: all 0.2s ease-out;
    }
    .plot-hotspot:hover {
      fill: rgba(234, 179, 8, 0.32);
      stroke: #ffd700;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.7));
    }
    .plot-hotspot.is-selected {
      fill: rgba(234, 179, 8, 0.42);
      stroke: #ffffff;
      stroke-width: 3;
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.9));
    }
    .status-dot {
      pointer-events: none;
      transition: transform 0.2s;
    }
    .plot-group:hover .status-dot {
      transform: scale(1.3);
    }
    #tooltip {
      position: absolute;
      display: none;
      pointer-events: none;
      background: rgba(12, 28, 20, 0.95);
      border: 1px solid #c5a059;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 50;
      backdrop-filter: blur(8px);
    }
  </style>
</head>

    const svg = document.getElementById('svg');
    const tooltip = document.getElementById('tooltip');

    const STATUS_COLORS = {
      AVAILABLE: '#22c55e',
      RESERVED: '#f59e0b',
      SOLD: '#ef4444'
    };

    PLOTS_DATA.forEach(plot => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'plot-group');

      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', plot.x - plot.w / 2);
      rect.setAttribute('y', plot.y - plot.h / 2);
      rect.setAttribute('width', plot.w);
      rect.setAttribute('height', plot.h);
      rect.setAttribute('class', 'plot-hotspot');
      rect.dataset.plotNumber = plot.num;

      // Status indicator dot
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', plot.x + plot.w / 2 - 4);
      circle.setAttribute('cy', plot.y - plot.h / 2 + 4);
      circle.setAttribute('r', 3);
      circle.setAttribute('fill', STATUS_COLORS[plot.status]);
      circle.setAttribute('class', 'status-dot');

      g.appendChild(rect);
      g.appendChild(circle);

      g.addEventListener('mouseenter', (e) => {
        tooltip.style.display = 'block';
        tooltip.innerHTML = `
          <div style="font-weight:700; font-size:13px; color:#fff; margin-bottom:2px;">Plot #${plot.num}</div>
          <div style="color:${STATUS_COLORS[plot.status]}; font-size:11px; font-weight:600; text-transform:uppercase;">${plot.status}</div>
          <div style="color:#cbd5e1; font-size:11px; margin-top:3px;">${plot.area.toLocaleString()} sq.ft • ${plot.facing} Facing</div>
          <div style="color:#f6d365; font-size:12px; font-weight:700; margin-top:2px;">₹${(plot.price / 100000).toFixed(2)} Lakhs</div>
          <div style="color:#94a3b8; font-size:10px;">${plot.road}</div>
        `;
      });

      g.addEventListener('mousemove', (e) => {
        const wrapRect = document.querySelector('.wrapper').getBoundingClientRect();
        tooltip.style.left = (e.clientX - wrapRect.left + 15) + 'px';
        tooltip.style.top = (e.clientY - wrapRect.top + 15) + 'px';
      });

      g.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });

      g.addEventListener('click', () => {
        document.querySelectorAll('.plot-hotspot').forEach(el => el.classList.remove('is-selected'));
        rect.classList.add('is-selected');
        alert(`Clicked Plot #${plot.num}!\nPrice: ₹${(plot.price/100000).toFixed(2)} L\nArea: ${plot.area} sq.ft\nStatus: ${plot.status}`);
      });

      svg.appendChild(g);
    });
